<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messaoud TV Sport</title>
  <meta name="theme-color" content="#0f172a">
  
  <!-- إعدادات التثبيت كتطبيق PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Messaoud TV">

  <!-- مشغل الفيديو HLS للبث المباشر -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: #151f32;
      --accent: #e11d48;
      --accent-hover: #be123c;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* الشريط العلوي */
    header {
      background: #111827;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--accent);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: 0.5px;
    }

    .brand span {
      color: var(--accent);
    }

    .badge-live {
      background: var(--accent);
      color: white;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 9999px;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* مساحة المشغل */
    .player-section {
      width: 100%;
      background: #000;
      position: sticky;
      top: 57px;
      z-index: 40;
    }

    .video-container {
      position: relative;
      padding-top: 56.25%; /* نسبة 16:9 */
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      outline: none;
    }

    /* قائمة القنوات */
    .channels-header {
      padding: 16px 20px 8px;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .channels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      padding: 12px 20px 30px;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    .channel-btn {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 14px 10px;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .channel-btn:hover {
      background: #1e293b;
      transform: translateY(-2px);
    }

    .channel-btn.active {
      border-color: var(--accent);
      background: #1e1b4b;
      box-shadow: 0 0 12px rgba(225, 29, 72, 0.35);
    }

    .channel-btn svg {
      width: 28px;
      height: 28px;
      fill: var(--accent);
    }

    .channel-name {
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      ⚽ MESSAOUD <span>TV</span>
    </div>
    <div class="badge-live">LIVE DIRECT</div>
  </header>

  <div class="player-section">
    <div class="video-container">
      <video id="tvPlayer" controls autoplay playsinline poster=""></video>
    </div>
  </div>

  <div class="channels-header">اختر القناة للمشاهدة المباشرة:</div>

  <div class="channels-grid">
    <button class="channel-btn active" onclick="playStream('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', this)">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <span class="channel-name">beIN SPORTS 1</span>
    </button>

    <button class="channel-btn" onclick="playStream('https://cph-p2p-msl.akamaized.net/hls/live/2000341/test/master.m3u8', this)">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <span class="channel-name">beIN SPORTS 2</span>
    </button>

    <button class="channel-btn" onclick="playStream('https://dash.akamaized.net/envivio/EnvivioDash3/manifest.mpd', this)">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <span class="channel-name">SSC SPORT</span>
    </button>

    <button class="channel-btn" onclick="playStream('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', this)">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <span class="channel-name">الجزائرية السادسة (الشبابية)</span>
    </button>
  </div>

  <script>
    const video = document.getElementById('tvPlayer');

    function playStream(url, btn) {
      document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
      if(btn) btn.classList.add('active');

      if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          video.play();
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.addEventListener('loadedmetadata', function() {
          video.play();
        });
      }
    }

    // تشغيل أول قناة افتراضياً
    playStream('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', null);
  </script>
</body>
</html>
