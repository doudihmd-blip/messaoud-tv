<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messaoud TV Sport</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #0b0f19; color: #fff; display: flex; flex-direction: column; min-height: 100vh; }
    header { background: #1f2937; padding: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e11d48; }
    header h1 { font-size: 1.1rem; color: #e11d48; }
    .badge { font-size: 0.75rem; background: #059669; padding: 4px 8px; border-radius: 8px; }
    .player-box { width: 100%; aspect-ratio: 16/9; background: #000; }
    video { width: 100%; height: 100%; object-fit: contain; }
    .input-box { padding: 10px; background: #111827; display: flex; gap: 8px; }
    .input-box input { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #374151; background: #1f2937; color: #fff; }
    .input-box button { background: #e11d48; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .channels { padding: 12px; flex: 1; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-top: 10px; }
    .card { background: #1f2937; border: 1px solid #374151; border-radius: 8px; padding: 12px; text-align: center; cursor: pointer; }
    .card:hover { border-color: #e11d48; }
    .card h4 { font-size: 0.85rem; margin-bottom: 4px; }
    .card span { font-size: 0.7rem; color: #9ca3af; }
  </style>
</head>
<body>
  <header>
    <h1>📺 Messaoud TV Sport</h1>
    <div class="badge" id="status">جاهز للبث</div>
  </header>
  <div class="player-box">
    <video id="player" controls autoplay playsinline></video>
  </div>
  <div class="input-box">
    <input type="text" id="streamUrl" placeholder="أدخل رابط قناة مباشر (m3u8)..." dir="ltr">
    <button onclick="playCustom()">تشغيل</button>
  </div>
  <div class="channels">
    <div style="font-size: 0.85rem; color: #9ca3af;">قنوات تجريبية سريعة:</div>
    <div class="grid" id="channelsList"></div>
  </div>
  <script>
    const channels = [
      { name: "بث تجريبي (تلقائي مرن)", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", desc: "Adaptive Low Net" },
      { name: "Red Bull TV Live", url: "https://rbmn-live.akamaized.net/hls/live/590964/BoRB-AT/master.m3u8", desc: "رياضة وأكشن" }
    ];
    const video = document.getElementById('player');
    const statusText = document.getElementById('status');
    let hls = null;
    function playStream(url) {
      if (Hls.isSupported()) {
        if (hls) hls.destroy();
        hls = new Hls({ maxBufferLength: 10, startLevel: 0 });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play(); statusText.innerText = "متصل"; });
        hls.on(Hls.Events.ERROR, () => { statusText.innerText = "خطأ في البث"; });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url; video.play();
      }
    }
    function playCustom() {
      const url = document.getElementById('streamUrl').value.trim();
      if (url) playStream(url);
    }
    const grid = document.getElementById('channelsList');
    channels.forEach(ch => {
      const div = document.createElement('div');
      div.className = 'card';
      div.innerHTML = `<h4>${ch.name}</h4><span>${ch.desc}</span>`;
      div.onclick = () => playStream(ch.url);
      grid.appendChild(div);
    });
    window.onload = () => playStream(channels[0].url);
  </script>
</body>
</html>
