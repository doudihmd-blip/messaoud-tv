name: Build Android APK

on:
push:
branches: [ main ]
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout Source
uses: actions/checkout@v4

- name: Setup Java
uses: actions/setup-java@v4
with:
distribution: 'zulu'
java-version: '17'

- name: Setup Node.js
uses: actions/setup-node@v4
with:
node-version: '20'

- name: Install Dependencies & Setup App
run: |
mkdir -p www
cp index.html www/
npm init -y
npm install @capacitor/core @capacitor/cli @capacitor/android
npx cap init "Messaoud TV" "com.messaoud.tv" --web-dir www
npx cap add android

- name: Build APK via Gradle
run: |
cd android
chmod +x gradlew
./gradlew assembleDebug

- name: Upload APK
uses: actions/upload-artifact@v4
with:
name: Messaoud-TV-App
path: android/app/build/outputs/apk/debug/app-debug.apk
